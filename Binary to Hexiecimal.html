	<!DOCTYPE html>
<html>
<head>

<title>Binary to Hexadecimal Converter</title>

<style>

body {
    font-family: Arial;
    text-align: center;
    background-color: #eeeeee;
}

h1 {
    color: #087fa3;
}

.box {
    background-color: white;
    width: 500px;
    margin: 50px auto;
    padding: 40px;
    border-radius: 10px;
}

input {
    font-size: 25px;
    width: 250px;
    padding: 8px;
    text-align: center;
}

button {
    background-color: #087fa3;
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 20px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background-color: #05627d;
}

#answer {
    font-size: 50px;
    font-weight: bold;
    color: green;
    margin-top: 30px;
}

</style>

</head>

<body>

<div class="box">

    <h1>Binary to Hexadecimal</h1>
<section>
<a href="index.html">BACK home</a>
</section>
    <p>Enter Binary:</p>

    <input id="binary" value="11010110">

    <br>

    <button onclick="convert()">▶ RUN</button>

    <div id="answer"></div>

</div>


<script>

function convert() {

    let binary = document.getElementById("binary").value;

    /* Check that only 0 and 1 are entered */

    if (!/^[01]+$/.test(binary)) {

        alert("Please enter only 0 and 1.");

        return;
    }

    /* Convert Binary to Decimal */

    let decimal = parseInt(binary, 2);

    /* Convert Decimal to Hexadecimal */

    let hexadecimal = decimal.toString(16).toUpperCase();

    /* Show only Hexadecimal */

    document.getElementById("answer").innerHTML =
        hexadecimal;

}

</script>

</body>
</html>
